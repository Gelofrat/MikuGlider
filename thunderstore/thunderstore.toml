[config]
schemaVersion = "1.2.0"

[package]
namespace = "Gelofrat"
name = "MikuGlider"
versionNumber = "0.12.0"
description = "Adds 3 Hatsune Miku skins for Glider."
websiteUrl = "https://github.com/Gelofrat/MikuGlider"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "../release"

[[build.copy]]
source = "../bin/Release/MikuGlider.dll"
target = "BepInEx/plugins/MikuGlider.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["mycopunk"]
